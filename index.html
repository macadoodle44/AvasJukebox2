<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jukebox Jumble</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <button onClick="window.location.reload();"></button>
    <h1>Jukebox Jumble</h1>
    <p>Click a button to search albums by genre or click the JUMBLE button for a random selection.</p>
        <div class="container">
            <button id="folk" data-genre="folk">FOLK</button>
            <button id="rock" data-genre="rock">ROCK</button>
            <button id="pop" data-genre="pop">POP</button>
            <button id="jazz" data-genre="jazz">JAZZ</button>
            <button id="soundtrack" data-genre="soundtrack">SOUNDTRACK</button>
            <button class="jumble">J umBl E!</button>
        </div>
    <br>
    <div class="albums container">
    </div>

    <script src="JJ.js"></script>
</body>
</html>
